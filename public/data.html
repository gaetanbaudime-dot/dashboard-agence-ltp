<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisie Data - Agence LTP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 20px; }

    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    select:focus, input:focus { outline: none; border-color: #667eea; }

    button { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #5a6fd6; }
    .btn-danger { background: #e74c3c; }
    .btn-danger:hover { background: #c0392b; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; color: #555; }
    tr:hover { background: #f8f9fa; }

    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-of { background: #e3f2fd; color: #1976d2; }
    .badge-mym { background: #fce4ec; color: #c2185b; }

    .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Saisie des Statistiques</h1>

    <div class="card">
      <h2 style="margin-bottom: 15px;">Ajouter une entree</h2>
      <div id="success" class="success">Donnees enregistrees !</div>

      <form id="form">
        <div class="form-grid">
          <div>
            <label>Creatrice</label>
            <select id="creator" required>
              <option value="">Choisir...</option>
            </select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label>Abonnes</label>
            <input type="number" id="subscribers" min="0" required>
          </div>
          <div>
            <label>CA</label>
            <input type="number" id="revenue" step="0.01" min="0" required>
          </div>
        </div>
        <button type="submit">Enregistrer</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 15px;">Dernieres entrees</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Creatrice</th>
            <th>Plateforme</th>
            <th>Abonnes</th>
            <th>CA</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let creators = [];

    async function loadCreators() {
      const res = await fetch('/api/creators');
      creators = await res.json();
      const select = document.getElementById('creator');
      creators.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name + ' (' + c.platform + ')';
        select.appendChild(opt);
      });
    }

    async function loadStats() {
      const res = await fetch('/api/stats');
      const stats = await res.json();
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = stats.slice(0, 50).map(s =>
        '<tr>' +
          '<td>' + new Date(s.date).toLocaleDateString('fr-FR') + '</td>' +
          '<td>' + s.name + '</td>' +
          '<td><span class="badge badge-' + s.platform.toLowerCase() + '">' + s.platform + '</span></td>' +
          '<td>' + s.subscribers + '</td>' +
          '<td>' + s.revenue.toFixed(2) + (s.platform === 'MYM' ? ' EUR' : ' USD') + '</td>' +
          '<td><button class="btn-danger" onclick="deleteStat(' + s.id + ')">X</button></td>' +
        '</tr>'
      ).join('');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        creator_id: document.getElementById('creator').value,
        date: document.getElementById('date').value,
        subscribers: parseInt(document.getElementById('subscribers').value),
        revenue: parseFloat(document.getElementById('revenue').value)
      };

      await fetch('/api/stats', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      document.getElementById('success').style.display = 'block';
      setTimeout(function() { document.getElementById('success').style.display = 'none'; }, 2000);

      document.getElementById('subscribers').value = '';
      document.getElementById('revenue').value = '';
      loadStats();
    });

    async function deleteStat(id) {
      if (confirm('Supprimer cette entree ?')) {
        await fetch('/api/stats/' + id, { method: 'DELETE' });
        loadStats();
      }
    }

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    loadCreators();
    loadStats();
  </script>
</body>
</html>
